name: Build Qur'an data

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_data.py"
      - "data/reciters/**"
      - "data/reciters_extra.json"
      - "data/backgrounds/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the data
        run: python tools/build_data.py

      - name: Show the report
        if: always()
        run: |
          if [ -f data/report.json ]; then cat data/report.json; fi

      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in data."
          else
            git commit -m "Update Qur'an data"
            git push
          fi
